<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choir Practice Tool</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Choir Practice Tool</h1>
    <span id="score-title" class="score-title"></span>
  </header>

  <main class="app-layout">
    <!-- Sidebar for part controls -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Parts</h2>
      </div>
      <div id="parts-list" class="parts-list">
        <p class="no-parts-message">Upload a MusicXML file to see parts</p>
      </div>
    </aside>

    <!-- Main content area -->
    <section class="main-content">
      <!-- File upload zone -->
      <div id="upload-prompt" class="upload-prompt">
        <div id="file-upload-zone" class="file-upload-zone">
          <div class="upload-icon">&#9835;</div>
          <h3>Upload MusicXML File</h3>
          <p>Drag and drop a .xml or .musicxml file here</p>
          <p class="upload-hint">or click to browse</p>
          <input type="file" id="file-input" accept=".xml,.musicxml,.mxl" style="display:none">
        </div>
      </div>

      <!-- Notation display area with canvas -->
      <div id="notation-area" class="notation-area" style="display: none;">
        <canvas id="notation-canvas" class="notation-canvas"></canvas>
      </div>

      <!-- Pitch indicator -->
      <div id="pitch-indicator" class="pitch-indicator" style="display: none;">
        <div class="pitch-note" id="pitch-note">--</div>
        <div class="pitch-cents" id="pitch-cents">0 cents</div>
        <div class="pitch-accuracy" id="pitch-accuracy"></div>
      </div>
    </section>
  </main>

  <!-- Bottom transport toolbar -->
  <footer class="transport-toolbar">
    <!-- Seek / progress bar spanning full width -->
    <div class="transport-progress">
      <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" class="seek-slider" title="Seek position">
    </div>

    <!-- Main controls row -->
    <div class="transport-row">
      <!-- Left: time + tempo -->
      <div class="transport-left">
        <span id="seek-time" class="seek-time">0:00</span>
        <div class="tempo-control" id="tempo-control">
          <div class="tempo-scrubber" id="tempo-scrubber" title="Drag left/right to adjust tempo">
            <span id="tempo-value" class="tempo-value">120</span>
            <span class="tempo-unit">BPM</span>
          </div>
        </div>
      </div>

      <!-- Center: play/pause -->
      <div class="transport-center">
        <button id="play-btn" class="play-btn" title="Play/Pause (Space)">
          <svg id="play-icon" class="transport-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
          <svg id="pause-icon" class="transport-icon" style="display:none" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="4" width="4" height="16"/>
            <rect x="15" y="4" width="4" height="16"/>
          </svg>
        </button>
      </div>

      <!-- Right: metronome, mic -->
      <div class="transport-right">
        <button id="metronome-btn" class="icon-btn" title="Toggle Metronome (M)">
          <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L6 22h12L12 2z"/>
            <line x1="12" y1="18" x2="16" y2="6"/>
          </svg>
          <div id="beat-indicator" class="beat-dot"></div>
        </button>
        <button id="mic-btn" class="icon-btn" title="Enable Microphone">
          <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="1" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
        </button>

      </div>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
