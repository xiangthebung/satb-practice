<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choir Practice Tool</title>
  <link rel="stylesheet" href="css/styles.css?v=mic-sync-3">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title" id="app-title" style="cursor: pointer;" title="Back to Home">Choir Practice Tool</h1>
    <span id="score-title" class="score-title"></span>
    <button id="export-btn" class="export-btn" title="Export MusicXML with current settings" style="display:none">
      <svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Export</span>
    </button>
  </header>

  <main class="app-layout">
    <!-- Sidebar for part controls -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Parts</h2>
      </div>
      <div id="parts-list" class="parts-list">
        <p class="no-parts-message">Upload a MusicXML file to see parts</p>
      </div>
    </aside>

    <!-- Main content area -->
    <section class="main-content">
      <!-- File upload zone -->
      <div id="upload-prompt" class="upload-prompt">
        <div id="file-upload-zone" class="file-upload-zone">
          <div class="upload-icon">&#9835;</div>
          <h3>Upload MusicXML File</h3>
          <p>Drag and drop a .xml or .musicxml file here</p>
          <p class="upload-hint">or click to browse</p>
          <input type="file" id="file-input" accept=".xml,.musicxml,.mxl" style="display:none">
        </div>
      </div>

      <!-- Notation display area with canvas -->
      <div id="notation-area" class="notation-area" style="display: none;">
        <canvas id="notation-canvas" class="notation-canvas"></canvas>
      </div>

      <!-- Calm, glanceable pitch guidance — no rapidly changing numbers -->
      <div
        id="pitch-indicator"
        class="pitch-indicator"
        data-state="listening"
        role="img"
        aria-label="Microphone listening"
        style="display: none;"
      >
        <span id="pitch-guidance" class="pitch-guidance">Listening</span>
        <div class="pitch-guide" aria-hidden="true">
          <span class="pitch-guide-center"></span>
          <span class="pitch-orb"></span>
        </div>
      </div>
      <span
        id="pitch-announcement"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
      ></span>
    </section>
  </main>

  <!-- Bottom transport toolbar -->
  <footer class="transport-toolbar">
    <!-- Seek / progress bar spanning full width -->
    <div class="transport-progress">
      <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" class="seek-slider" title="Seek position">
    </div>

    <!-- Main controls row -->
    <div class="transport-row">
      <!-- Left: time + tempo -->
      <div class="transport-left">
        <span id="seek-time" class="seek-time">0:00</span>
        <div class="tempo-control" id="tempo-control">
          <div class="tempo-scrubber" id="tempo-scrubber" title="Drag left/right to adjust tempo">
            <span id="tempo-value" class="tempo-value">120</span>
            <span class="tempo-unit">BPM</span>
          </div>
        </div>
      </div>

      <!-- Center: play/pause -->
      <div class="transport-center">
        <button id="play-btn" class="play-btn" title="Play/Pause (Space)">
          <svg id="play-icon" class="transport-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
          <svg id="pause-icon" class="transport-icon" style="display:none" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="4" width="4" height="16"/>
            <rect x="15" y="4" width="4" height="16"/>
          </svg>
        </button>
      </div>

      <!-- Right: metronome, repeat, mic -->
      <div class="transport-right">
        <button id="repeat-btn" class="icon-btn" title="Toggle Repeat (R)">
          <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 1l4 4-4 4"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <path d="M7 23l-4-4 4-4"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
        <button id="metronome-btn" class="icon-btn" title="Toggle Metronome (M)">
          <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L6 22h12L12 2z"/>
            <line x1="12" y1="18" x2="16" y2="6"/>
          </svg>
          <div id="beat-indicator" class="beat-dot"></div>
        </button>
        <button id="mic-btn" class="icon-btn" title="Enable Microphone" aria-label="Enable microphone" aria-pressed="false">
          <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="1" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
        </button>
        <div class="settings-menu-wrapper">
          <button id="settings-btn" class="icon-btn" title="Settings">
            <svg class="transport-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.08 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1.08z"/>
            </svg>
          </button>
          <div id="settings-popover" class="settings-popover" style="display:none">
            <div class="settings-popover-row">
              <label class="settings-popover-label" title="Synthesized tone or human singing voice">Voice</label>
              <div class="synth-toggle" id="synth-toggle">
                <button class="synth-toggle-btn" data-mode="oscillator" title="Synthesized oscillator sound">Synth</button>
                <button class="synth-toggle-btn active" data-mode="vocal" title="Human-like singing voice">Vocal</button>
              </div>
            </div>
            <div class="settings-popover-row">
              <label class="settings-popover-label" title="How long fermatas are held (1.0x = no extra hold)">Fermata</label>
              <div class="fermata-scrubber" id="fermata-scrubber" title="Drag left/right to adjust">
                <svg class="scrubber-drag-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 8H12"/>
                  <path d="M6 6L4 8L6 10"/>
                  <path d="M10 6L12 8L10 10"/>
                </svg>
                <span id="fermata-value">2.0x</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </footer>

  <script type="module" src="js/app.js?v=mic-sync-3"></script>
</body>
</html>
