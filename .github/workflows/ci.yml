name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: Lint, static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:static
      - run: npm test
      - run: npm run test:parser

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# Deploying is not done here. Cloudflare's own Workers Builds GitHub app is already
# connected to this repository and builds every push itself — it is what put the
# current site up, and a `wrangler deploy` job here would either duplicate that or
# race it. Doing it from Actions would also need a CLOUDFLARE_API_TOKEN secret that
# this repository does not have, so the job could only ever fail.
#
# The tradeoff, worth knowing: Cloudflare deploys on push without waiting for the
# suites above, so a red build can still reach the site. Moving the deploy back here
# behind `needs: [checks, browser]` is the fix if that becomes a problem, and it
# needs the API token plus turning the Workers Builds integration off.
